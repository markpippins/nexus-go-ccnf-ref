name: CCNF Conformance (R1-R10.3)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  r1-ccnf-determinism:
    name: "R1: CCNF determinism"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.22', '1.23']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: R1 — golden vectors + determinism
        run: go test -run 'TestGoldenVectors|TestSerializerDeterminism' -count=1 ./ccnf/...
        shell: bash
      - name: R1 — hash-locked golden vectors (conformance binary)
        run: |
          go build -o ccnf-conformance ./conformance
          ./ccnf-conformance run vectors/v1
        shell: bash

  r2-equivalence-closure:
    name: "R2: Equivalence closure"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.22', '1.23']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: R2 — determinism + equivalence + collision
        run: go test -run "TestR2Determinism|TestR2EquivalenceClassBoundary|TestR2CrossOrderEquivalence" -count=1 -timeout 120s ./ccnf/...
        shell: bash
      - name: R2 — unicode + timestamp boundaries
        run: go test -run "TestR2UnicodeStress|TestR2TimestampBoundaries" -count=1 -timeout 120s ./ccnf/...
        shell: bash
      - name: R2 — collision atlas (100k)
        run: go test -run TestR2CollisionDetection -count=1 -timeout 300s ./ccnf/...

  r3-cer-roundtrip:
    name: "R3: CER round-trip"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.22', '1.23']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: R3 — CER serialize/rehydrate round-trip
        run: go test -run "TestCER" -count=1 -timeout 60s ./ccnf/...
        shell: bash

  r4-replay-oracle:
    name: "R4: Replay oracle"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.22', '1.23']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: R4 — fold determinism + cursor + idempotency
        run: go test -count=1 ./replay/...
        shell: bash

  r5-snapshot-oracle:
    name: "R5: Snapshot oracle"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.22', '1.23']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: R5 — tri-version lock + equivalence + round-trip
        run: go test -count=1 ./replay/snapshot/...
        shell: bash

  r4r5-crosscheck:
    name: "R4=R5 cross-check"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.22', '1.23']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: R4=R5 — Fold(events) == Snapshot(state(events)) across all golden vectors
        run: go test -run 'TestR4R5' -count=1 ./replay/...
        shell: bash

  r6-cross-platform:
    name: "R6: Cross-platform build"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.22', '1.23']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: R6 — cross-platform build
        run: |
          go build ./ccnf/...
          go vet ./conformance
          go build ./replay/...
          go build ./runtime/...
          go build ./runtime/replay/...
          go build ./runtime/rehydrate/...
          go build ./projection/...
        shell: bash
      - name: R6 — build and verify golden vectors
        run: |
          go build -o ccnf-conformance ./conformance
          ./ccnf-conformance run vectors/v1
        shell: bash

  r10-3-rehydration:
    name: "R10.3: Rehydration — observer wall"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.22', '1.23']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: R10.3 — forbidden imports
        run: make rehydrate-forbidden-imports
        shell: bash
      - name: R10.3 — registry immutability
        run: make rehydrate-registry-immutability
        shell: bash
      - name: R10.3 — view purity
        run: make rehydrate-view-purity && make rehydrate-no-pointer-receivers && make rehydrate-no-domain-words && make rehydrate-no-cross-view
        shell: bash
      - name: R10.3 — build isolation
        run: make rehydrate-build-isolation
        shell: bash
      - name: R10.3 — rehydration tests
        run: go test -count=1 ./runtime/rehydrate/...
        shell: bash

  r10-3b-projection:
    name: "R10.3B: Projection layer — semantic interpretation"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.22', '1.23']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: R10.3B — no back-edge
        run: make projection-no-rehydration-backedge
        shell: bash
      - name: R10.3B — view style
        run: make projection-cache-not-exposed && make projection-no-pointer-receivers
        shell: bash
      - name: R10.3B — build isolation
        run: make projection-build-isolation
        shell: bash
      - name: R10.3B — projection tests
        run: go test -count=1 ./projection/...
        shell: bash

  pdtp-phase-a:
    name: "PDTD: Phase A — dependency topology hardening"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.22', '1.23']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: PDTD — PGV Go (P6–P10 dependency topology checks)
        run: make pdtp
        shell: bash
      - name: PDTD — Dependency visibility (advisory)
        run: make dependency-visibility
        shell: bash

  pdtd-phase-b-verify:
    name: "PDTD: Phase B verify — PGV topology enforcement"
    continue-on-error: false
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.22', '1.23']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: PDTD — Phase B parity verification
        run: make pdtp-phase-b-verify
        shell: bash
