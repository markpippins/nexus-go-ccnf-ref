name: CCNF Conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.22']
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Unit tests + golden vectors
        run: go test ./ccnf/...

      - name: Build conformance binary
        run: go build -o ccnf-conformance ./conformance

      - name: Run golden vector suite
        run: ./ccnf-conformance run vectors/v1

      - name: Fuzz determinism check
        run: go test -run TestFuzz ./conformance/...

      - name: Cross-platform build test
        run: |
          go build ./ccnf/...
          go build ./conformance
